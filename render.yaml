# Development/demo deployment. All meter readings and credit are simulated.
services:
  - type: web
    name: dormenergy
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.lock.txt
    startCommand: bash scripts/start-render.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: dormenergy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false
      - key: SIMULATION_MODE
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: LOW_BALANCE_THRESHOLD
        value: "100.00"
databases:
  - name: dormenergy-db
    region: oregon
    plan: free
    databaseName: dormenergy
    user: dormenergy
    ipAllowList: []
