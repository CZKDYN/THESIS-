name: Build and test
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dormenergy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dormenergy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SECRET_KEY: ci-only-not-a-production-signing-key
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dormenergy_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dormenergy_test
      SIMULATION_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Validate dependencies and startup scripts
        run: |
          python -m pip check
          bash -n scripts/start-render.sh scripts/setup-cloud.sh scripts/start-cloud.sh scripts/stop-cloud.sh
      - name: Check published dependency advisories
        run: python scripts/check_dependency_advisories.py --output artifacts/dependency-advisories.json
      - name: Validate schema
        run: |
          python -m flask --app wsgi db upgrade
          python -m flask --app wsgi db check
      - name: Run PostgreSQL integration tests
        run: python -m pytest -q --junitxml=artifacts/backend-tests.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/
          if-no-files-found: ignore
  backend-portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - name: Portable SQLite tests (PostgreSQL races explicitly skipped)
        run: python -m pytest -q tests --junitxml=artifacts/portable-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/portable-tests.xml
  gateway-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: gateway/requirements-dev.txt
      - run: python -m pip install -r gateway/requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e gateway
      - run: python -m pip check
      - run: python -m pytest -q gateway/tests/test_gateway.py --junitxml=artifacts/gateway-unit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-unit-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/gateway-unit-tests.xml
  gateway-network:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: dormenergy_gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gateway_test -d dormenergy_gateway_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RUN_GATEWAY_E2E: '1'
      GATEWAY_TEST_DATABASE_URL: postgresql+psycopg://gateway_test:isolated-test-only@localhost:5432/dormenergy_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install test-only broker and pinned Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
          python -m pip install -r requirements.lock.txt -r gateway/requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e gateway
      - name: Exercise the authenticated MQTT to PostgreSQL path
        run: python -m pytest -q -s gateway/tests/test_end_to_end.py --junitxml=artifacts/gateway-network-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-network-test-results
          path: |
            artifacts/gateway-network-tests.xml
            artifacts/audit/network-reliability.json
          if-no-files-found: ignore
