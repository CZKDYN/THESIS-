name: Build and test
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dormenergy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dormenergy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SECRET_KEY: ci-only-not-a-production-signing-key
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dormenergy_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dormenergy_test
      SIMULATION_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Validate dependencies and startup scripts
        run: |
          python -m pip check
          bash -n scripts/start-render.sh scripts/setup-cloud.sh scripts/start-cloud.sh scripts/stop-cloud.sh
      - name: Validate schema
        run: |
          python -m flask --app wsgi db upgrade
          python -m flask --app wsgi db check
      - name: Run PostgreSQL integration tests
        run: python -m pytest -q --junitxml=artifacts/backend-tests.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/backend-tests.xml
          if-no-files-found: ignore
