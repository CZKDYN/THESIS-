[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dormenergy-gateway"
version = "0.1.1"
description = "Durable MQTT-to-HTTPS monitoring gateway for DormEnergy"
requires-python = ">=3.11"
dependencies = ["paho-mqtt==2.1.0", "tzdata==2025.2"]

[project.scripts]
dormenergy-gateway = "dormenergy_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
